<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<!--
  Content Security Policy (OWASP A05 – Security Misconfiguration).
  The page needs 'unsafe-inline' for its own inline <style>/<script> blocks, but
  everything else is locked down. Most importantly connect-src 'none' means that
  even if a crafted spreadsheet managed to inject script, it has no channel to
  send your cost or sales data anywhere. All processing stays in the browser.
  When serving this suite over HTTP, also send these as real response headers
  together with X-Content-Type-Options: nosniff and X-Frame-Options: DENY
  (frame-ancestors is ignored in a <meta> CSP).
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"/>
<meta name="referrer" content="no-referrer"/>
<title>Profit Analyzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<!--
  Subresource Integrity (OWASP A08 – Software and Data Integrity Failures).
  The hash pins the exact byte content of SheetJS 0.18.5; if the CDN ever serves
  a different file the browser refuses to run it. To regenerate after a version
  bump:  curl -s <url> | openssl dgst -sha512 -binary | openssl base64 -A
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"
        integrity="sha512-r22gChDnGvBylk90+2e/ycr3RVrDi8DIOkIGNhJlKfuyQM4tIRAI062MaV8sfjQKYVGjOBaZBOA87z+IhZE9DA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
  :root {
    --bg: #0f1117;
    --bg2: #1a1d27;
    --bg3: #22263a;
    --bg4: #2d3149;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #e8eaf6;
    --text2: #9fa3c0;
    --text3: #6b6f8a;
    --accent: #5c7cfa;
    --accent2: #4263d0;
    --green: #40c57a;
    --green-bg: rgba(64,197,122,0.12);
    --red: #f06060;
    --red-bg: rgba(240,96,96,0.12);
    --amber: #f0a040;
    --amber-bg: rgba(240,160,64,0.12);
    --teal: #3ecfb8;
    --teal-bg: rgba(62,207,184,0.12);
    --radius: 10px;
    --radius-sm: 6px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  [data-theme="light"] {
    --bg: #f0f2f9;
    --bg2: #ffffff;
    --bg3: #f5f6fc;
    --bg4: #eaecf8;
    --border: rgba(0,0,0,0.07);
    --border2: rgba(0,0,0,0.13);
    --text: #1a1d30;
    --text2: #52567a;
    --text3: #9094b0;
    --accent: #4263d0;
    --accent2: #3352b0;
    --green: #1a9951;
    --green-bg: rgba(26,153,81,0.10);
    --red: #d03030;
    --red-bg: rgba(208,48,48,0.10);
    --amber: #c07000;
    --amber-bg: rgba(192,112,0,0.10);
    --teal: #0d9e89;
    --teal-bg: rgba(13,158,137,0.10);
    --shadow: 0 4px 24px rgba(0,0,0,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
  body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background 0.3s, color 0.3s;
  }
  body.rtl { direction: rtl; }

  header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 0 28px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: -0.3px; color: var(--text); }
  .logo-icon {
    width: 32px; height: 32px;
    background: var(--accent);
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 16px;
  }
  .header-actions { display: flex; align-items: center; gap: 10px; }
  .btn-icon {
    width: 36px; height: 36px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border2);
    background: var(--bg3);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text2); font-size: 16px;
    transition: all 0.15s;
  }
  .btn-icon:hover { background: var(--bg4); color: var(--text); }
  .btn-lang {
    height: 36px; padding: 0 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border2);
    background: var(--bg3);
    cursor: pointer; color: var(--text2);
    font-size: 13px; font-weight: 600;
    transition: all 0.15s;
  }
  .btn-lang:hover { background: var(--bg4); color: var(--text); }

  main { padding: 28px; max-width: 1500px; margin: 0 auto; }

  /* ---------- Unlock gate ---------- */
  .lock-card {
    max-width: 440px; margin: 60px auto;
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 36px 32px; text-align: center;
    box-shadow: var(--shadow);
  }
  .lock-icon { font-size: 42px; margin-bottom: 14px; }
  .lock-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; color: var(--text); }
  .lock-sub { font-size: 13px; color: var(--text2); line-height: 1.7; margin-bottom: 22px; }
  #lock-form { display: flex; flex-direction: column; gap: 12px; }
  #lock-input {
    height: 44px; padding: 0 14px; text-align: center;
    border-radius: var(--radius-sm); border: 1px solid var(--border2);
    background: var(--bg3); color: var(--text); font-size: 15px; outline: none;
    letter-spacing: 1px;
  }
  #lock-input:focus { border-color: var(--accent); }
  .lock-remember {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    font-size: 12.5px; color: var(--text2); cursor: pointer; user-select: none;
  }
  .lock-remember input { width: 15px; height: 15px; cursor: pointer; accent-color: var(--accent); }
  .lock-error { margin-top: 14px; font-size: 13px; color: var(--red); min-height: 18px; font-weight: 600; }

  .upload-zone.solo { max-width: 560px; margin: 0 auto; }
  .cost-note {
    max-width: 560px; margin: 16px auto 0; text-align: center;
    font-size: 12.5px; color: var(--text3); line-height: 1.7;
  }
  .cost-note b { color: var(--text2); font-weight: 700; }

  /* ---------- Cost settings modal ---------- */
  #cost-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.6); z-index: 900;
    align-items: center; justify-content: center; padding: 20px;
  }
  #cost-overlay.show { display: flex; }
  #cost-modal {
    background: var(--bg2); border: 1px solid var(--border2);
    border-radius: var(--radius); width: 100%; max-width: 860px;
    max-height: 88vh; display: flex; flex-direction: column;
    box-shadow: var(--shadow); overflow: hidden;
  }
  .cm-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 14px; padding: 20px 22px 14px; border-bottom: 1px solid var(--border);
  }
  .cm-title { font-size: 17px; font-weight: 700; color: var(--text); }
  .cm-sub { font-size: 12.5px; color: var(--text3); margin-top: 4px; line-height: 1.6; }
  .cm-tools {
    display: flex; gap: 8px; padding: 14px 22px; flex-wrap: wrap;
    align-items: center; border-bottom: 1px solid var(--border);
  }
  .cm-tools .search-box { min-width: 180px; }
  #cm-file { display: none; }
  #cm-alerts:not(:empty) { padding: 12px 22px 0; }
  .cm-list { overflow-y: auto; flex: 1; padding: 6px 12px 12px; }
  .cm-row {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 10px; border-bottom: 1px solid var(--border);
  }
  .cm-row:last-child { border-bottom: none; }
  .cm-row.edited { background: var(--teal-bg); border-radius: var(--radius-sm); }
  .cm-info { flex: 1; min-width: 0; }
  .cm-name { font-size: 13.5px; font-weight: 600; color: var(--text); unicode-bidi: plaintext;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cm-meta { font-size: 11px; color: var(--text3); margin-top: 2px; unicode-bidi: plaintext; }
  .cm-code { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .cm-input {
    width: 130px; height: 34px; padding: 0 10px; flex-shrink: 0;
    border-radius: var(--radius-sm); border: 1px solid var(--border2);
    background: var(--bg3); color: var(--text);
    font-size: 13.5px; text-align: right; outline: none;
    direction: ltr; font-variant-numeric: tabular-nums;
  }
  .cm-input:focus { border-color: var(--accent); }
  .cm-input.edited { border-color: var(--teal); color: var(--teal); font-weight: 700; }
  .cm-undo {
    width: 30px; height: 30px; flex-shrink: 0; border-radius: var(--radius-sm);
    border: 1px solid var(--border2); background: var(--bg3);
    color: var(--text3); cursor: pointer; font-size: 13px;
  }
  .cm-undo:hover { background: var(--bg4); color: var(--text); }
  .cm-undo[disabled] { opacity: 0.25; cursor: default; }
  .cm-foot {
    padding: 12px 22px; border-top: 1px solid var(--border);
    font-size: 12.5px; color: var(--text3); display: flex;
    justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center;
  }
  .cm-count { font-weight: 700; color: var(--text2); }

  /* ---------- Upload ---------- */
  .upload-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 18px;
    margin-bottom: 20px;
  }
  .upload-zone {
    border: 2px dashed var(--border2);
    border-radius: var(--radius);
    padding: 36px 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--bg2);
  }
  .upload-zone:hover, .upload-zone.drag { border-color: var(--accent); background: var(--bg3); }
  .upload-zone.loaded { border-style: solid; border-color: var(--green); background: var(--green-bg); }
  .upload-icon { font-size: 40px; margin-bottom: 12px; }
  .upload-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
  .upload-sub { font-size: 13px; color: var(--text2); }
  .upload-hint { font-size: 12px; color: var(--text3); margin-top: 8px; }
  .upload-file { font-size: 12px; color: var(--green); margin-top: 10px; font-weight: 600; word-break: break-all; }
  .upload-step {
    display: inline-block; font-size: 11px; font-weight: 700;
    color: var(--accent); background: var(--bg4);
    padding: 2px 10px; border-radius: 20px; margin-bottom: 12px;
    letter-spacing: 0.4px;
  }
  input[type="file"] { display: none; }

  .btn-primary {
    height: 44px; padding: 0 28px;
    border-radius: var(--radius-sm);
    border: none;
    background: var(--accent);
    color: #fff; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: all 0.15s;
  }
  .btn-primary:hover:not(:disabled) { background: var(--accent2); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .analyze-row { text-align: center; margin-top: 8px; }

  /* ---------- Alerts ---------- */
  .alert {
    border-radius: var(--radius);
    padding: 12px 16px;
    font-size: 13px;
    margin-bottom: 14px;
    line-height: 1.7;
    border: 1px solid transparent;
  }
  .alert-err { background: var(--red-bg); color: var(--red); border-color: var(--red); }
  .alert-warn { background: var(--amber-bg); color: var(--amber); border-color: var(--amber); }
  .alert-info { background: var(--teal-bg); color: var(--teal); border-color: var(--teal); }
  .alert b { font-weight: 700; }
  .alert code {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    background: rgba(128,128,128,0.18);
    padding: 1px 5px; border-radius: 4px; font-size: 12px;
  }

  /* ---------- Stats ---------- */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 14px;
    margin-bottom: 22px;
  }
  .stat-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
  }
  .stat-label { font-size: 11px; color: var(--text3); margin-bottom: 6px; letter-spacing: 0.3px; text-transform: uppercase; }
  .stat-value { font-size: 21px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  .stat-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }
  .stat-value.green { color: var(--green); }
  .stat-value.red { color: var(--red); }
  .stat-value.accent { color: var(--accent); }
  .stat-value.amber { color: var(--amber); }
  .stat-value.teal { color: var(--teal); }

  /* ---------- Controls ---------- */
  .controls-row { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; align-items: center; }
  .search-box { flex: 1; min-width: 220px; position: relative; }
  .search-box input {
    width: 100%; height: 38px;
    padding: 0 14px 0 38px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border2);
    background: var(--bg2); color: var(--text);
    font-size: 14px; outline: none; transition: border 0.15s;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 16px; pointer-events: none; }
  body.rtl .search-box input { padding: 0 38px 0 14px; }
  body.rtl .search-icon { left: auto; right: 12px; }

  .filter-btn {
    height: 38px; padding: 0 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border2);
    background: var(--bg2); cursor: pointer;
    color: var(--text2); font-size: 13px; font-weight: 500;
    transition: all 0.15s; white-space: nowrap;
  }
  .filter-btn:hover { background: var(--bg3); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .filter-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

  .btn-excel {
    background: linear-gradient(135deg, #1a6e3c, #217346) !important;
    border-color: #1a6e3c !important; color: #fff !important;
    font-weight: 700 !important; letter-spacing: 0.3px;
    box-shadow: 0 2px 8px rgba(26,110,60,0.35); transition: all 0.2s !important;
  }
  .btn-excel:hover { background: linear-gradient(135deg, #217346, #2a9059) !important; box-shadow: 0 4px 16px rgba(26,110,60,0.5) !important; transform: translateY(-1px); }
  .btn-print {
    background: linear-gradient(135deg, #7c3aed, #5b21b6) !important;
    border-color: #7c3aed !important; color: #fff !important;
    font-weight: 700 !important; letter-spacing: 0.3px;
    box-shadow: 0 2px 8px rgba(124,58,237,0.35); transition: all 0.2s !important;
  }
  .btn-print:hover { background: linear-gradient(135deg, #8b5cf6, #7c3aed) !important; box-shadow: 0 4px 16px rgba(124,58,237,0.5) !important; transform: translateY(-1px); }

  /* ---------- Salesperson picker ---------- */
  .sp-panel {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 18px;
  }
  .sp-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .sp-title { font-size: 13px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: 0.4px; }
  .sp-actions { display: flex; gap: 6px; }
  .sp-mini {
    height: 28px; padding: 0 10px; font-size: 12px; font-weight: 600;
    border-radius: var(--radius-sm); border: 1px solid var(--border2);
    background: var(--bg3); color: var(--text2); cursor: pointer;
  }
  .sp-mini:hover { background: var(--bg4); color: var(--text); }
  .sp-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .sp-chip {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px;
    border-radius: 30px;
    border: 1px solid var(--border2);
    background: var(--bg3);
    cursor: pointer; font-size: 13px; color: var(--text2);
    transition: all 0.15s; user-select: none;
  }
  .sp-chip:hover { background: var(--bg4); }
  .sp-chip.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .sp-chip .sp-amt { font-size: 11px; opacity: 0.8; font-variant-numeric: tabular-nums; }
  .sp-chip .sp-box {
    width: 15px; height: 15px; border-radius: 4px;
    border: 1.5px solid currentColor; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 10px;
  }

  /* ---------- Tabs ---------- */
  .tabs { display: flex; gap: 4px; margin-bottom: 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .tab {
    padding: 10px 18px; font-size: 14px; font-weight: 600;
    color: var(--text3); background: none; border: none;
    border-bottom: 2px solid transparent; cursor: pointer; transition: all 0.15s;
  }
  .tab:hover { color: var(--text2); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* ---------- Table ---------- */
  .table-wrap { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead { background: var(--bg3); }
  thead th {
    padding: 12px 14px; font-size: 11px; font-weight: 600;
    color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px;
    text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  body.rtl thead th { text-align: right; }
  thead th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  body.rtl thead th.num, body.rtl td.num { text-align: left; }
  thead th.sortable { cursor: pointer; user-select: none; }
  thead th.sortable:hover { color: var(--text2); background: var(--bg4); }
  thead th.sort-active { color: var(--accent) !important; }
  .sort-arrow { display: inline-block; margin-left: 4px; font-size: 10px; opacity: 0.4; }
  .sort-arrow.active { opacity: 1; color: var(--accent); }
  body.rtl .sort-arrow { margin-left: 0; margin-right: 4px; }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--bg3); }
  tbody tr.row-warn { background: var(--amber-bg); }
  tbody tr.row-warn:hover { background: var(--amber-bg); filter: brightness(1.1); }
  td { padding: 11px 14px; font-size: 13.5px; color: var(--text); vertical-align: middle; }
  tfoot td {
    padding: 13px 14px; font-size: 14px; font-weight: 700;
    background: var(--bg3); border-top: 2px solid var(--border2); color: var(--text);
  }
  .p-name { font-weight: 600; font-size: 13.5px; }
  .p-code { font-size: 11px; color: var(--text3); margin-top: 2px; font-family: ui-monospace, Menlo, Consolas, monospace; }
  /* Numbers keep a left-to-right run in both languages: without this the
     minus sign of a negative figure is reordered to the wrong end in RTL. */
  td.num, tfoot td.num, .amount, .stat-value, .bar-val, .mover-val, .p-code, .sp-amt {
    direction: ltr;
    unicode-bidi: isolate;
  }
  /* Mixed Arabic/English names follow their own direction, whichever UI
     language is active. */
  .p-name, .mover-name, .bar-label, .sp-chip .sp-name, td.bidi, .cmp-table th.num {
    unicode-bidi: plaintext;
  }
  .amount { font-weight: 600; font-variant-numeric: tabular-nums; }
  .amount.positive { color: var(--green); }
  .amount.negative { color: var(--red); }
  .amount.zero { color: var(--text3); }
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 8px; border-radius: 20px;
    font-size: 11px; font-weight: 600; white-space: nowrap;
  }
  .badge-green { background: var(--green-bg); color: var(--green); }
  .badge-red { background: var(--red-bg); color: var(--red); }
  .badge-amber { background: var(--amber-bg); color: var(--amber); }
  .badge-gray { background: var(--bg4); color: var(--text3); }
  .badge-teal { background: var(--teal-bg); color: var(--teal); }
  .empty { text-align: center; padding: 60px 20px; color: var(--text3); font-size: 15px; }

  /* ---------- Charts ---------- */
  .panel-grid { display: grid; grid-template-columns: 1fr; gap: 18px; margin-bottom: 22px; }
  @media (min-width: 880px) { .panel-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .panel { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; }
  .panel-title { font-size: 13px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 16px; }
  .bar-row { margin-bottom: 13px; }
  .bar-head { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; margin-bottom: 5px; }
  .bar-label { color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-val { font-weight: 700; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .bar-track { height: 9px; background: var(--bg4); border-radius: 20px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 20px; transition: width 0.4s ease; }

  .bar-fill.neg { background: linear-gradient(90deg, var(--red), var(--amber)); }

  .mover { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); }

  .mover-name { font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mover-meta { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .mover-val { font-weight: 700; font-size: 13.5px; font-variant-numeric: tabular-nums; flex-shrink: 0; }

  /* ---------- Comparison ---------- */
  .cmp-wrap { overflow-x: auto; }
  .cmp-table th.metric, .cmp-table td.metric { font-weight: 700; color: var(--text2); white-space: nowrap; }

    main { padding: 16px; }

    .logo span { display: none; }
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    td, thead th { padding: 9px 10px; font-size: 12.5px; }

  /* ---------- Print ---------- */
  #print-overlay {
    display: none; position: fixed; inset: 0;

  #print-frame {
    background: #fff; color: #111; border-radius: var(--radius);

  #print-frame h2 { font-size: 18px; font-weight: 700; margin-bottom: 6px; color: #111; }
  #print-frame .print-meta { font-size: 12px; color: #666; margin-bottom: 18px; }
  #print-frame .print-header {

  #print-frame .print-header-text { flex: 1; }
  #print-frame.rtl { direction: rtl; }
  #print-frame.rtl .print-header { flex-direction: row-reverse; text-align: right; }
  #print-frame table { width: 100%; border-collapse: collapse; font-size: 12.5px; border: 2px solid #3f4282; margin-bottom: 18px; }
  #print-frame thead th {

  #print-frame tbody tr:nth-child(even) { background: #f5f6fc; }
  #print-frame tbody td { padding: 8px 10px; border: 1px solid #d0d2e8; color: #222; }
  #print-frame tfoot td { padding: 9px 10px; border: 1px solid #3f4282; background: #eaecf8; font-weight: 700; }
  #print-frame td.bidi { unicode-bidi: plaintext; }
  #print-frame td:not(.bidi), #print-frame tfoot td { direction: ltr; unicode-bidi: isolate; }
  #print-frame .pos { color: #1a7f4b; font-weight: 700; }
  #print-frame .neg { color: #c02626; font-weight: 700; }
  #print-frame .print-actions { display: flex; gap: 10px; margin-bottom: 20px; }
  #print-frame .print-actions button {
    height: 36px; padding: 0 16px; border-radius: 6px; border: 1px solid #ccd;
    background: #f0f2f9; cursor: pointer; font-size: 13px; font-weight: 600; color: #333;
  }

var KEY_STORE = 'hilalProfitKey';     // exported AES key, session- or device-scoped
var COSTS_STORE = 'hilalProfitCosts'; // the user's own cost edits, encrypted

var cryptoKey = null;                  // CryptoKey once unlocked
var builtIn = Object.create(null);     // CODE -> {code, name, cost, cat}
var builtInOrder = [];
var localCosts = { overrides: Object.create(null), added: Object.create(null) };

function b64ToBytes(b64) {
  var bin = atob(String(b64));
  var out = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function bytesToB64(bytes) {
  var s = '';
  for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s);
}

function cryptoOk() {
  return !!(window.crypto && window.crypto.subtle && window.crypto.getRandomValues);
}

function deriveKey(passphrase, salt, iterations) {
  return crypto.subtle.importKey('raw', new TextEncoder().encode(passphrase),
                                 'PBKDF2', false, ['deriveKey'])
    .then(function (base) {
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: salt, iterations: iterations, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
    });
}

function aesDecrypt(key, iv, ct) {
  return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
}

function aesEncrypt(key, plaintextBytes) {
  var iv = crypto.getRandomValues(new Uint8Array(12));
  return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, plaintextBytes)
    .then(function (ct) { return bytesToB64(iv) + '.' + bytesToB64(new Uint8Array(ct)); });
}

function aesDecryptPacked(key, packed) {
  var parts = String(packed).split('.');
  if (parts.length !== 2) return Promise.reject(new Error('FORMAT'));
  return aesDecrypt(key, b64ToBytes(parts[0]), b64ToBytes(parts[1]));
}

/* Builds the in-memory product table from the decrypted payload. */
function loadBuiltIn(json) {
  var data = JSON.parse(json);
  var items = (data && data.items) || [];
  builtIn = Object.create(null);
  builtInOrder = [];
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    var key = String(it.c || '').trim().toUpperCase();
    if (!key) continue;
    if (!builtIn[key]) builtInOrder.push(key);
    builtIn[key] = { code: String(it.c).trim(), name: String(it.n || ''),
                     cost: Number(it.u) || 0, cat: String(it.g || '') };
  }
  if (!builtInOrder.length) throw new Error('EMPTY_TABLE');
}

/* Unlocks with a passphrase; resolves only if the ciphertext authenticates. */
function unlockWithPassphrase(passphrase) {
  if (!cryptoOk()) return Promise.reject(new Error('NO_CRYPTO'));
  if (!COST_BLOB || !COST_BLOB.ct) return Promise.reject(new Error('NO_BLOB'));
  return deriveKey(passphrase, b64ToBytes(COST_BLOB.salt), COST_BLOB.it || 250000)
    .then(function (key) {
      return aesDecrypt(key, b64ToBytes(COST_BLOB.iv), b64ToBytes(COST_BLOB.ct))
        .then(function (plain) {
          loadBuiltIn(new TextDecoder().decode(plain));
          cryptoKey = key;
          return key;

    });

        .then(function (plain) {
          loadBuiltIn(new TextDecoder().decode(plain));
          cryptoKey = key;
          return key;
        });
    });
}

function rememberKey(key, onDevice) {
  return crypto.subtle.exportKey('raw', key).then(function (raw) {
    var b64 = bytesToB64(new Uint8Array(raw));
    try {
      sessionStorage.setItem(KEY_STORE, b64);
      if (onDevice) localStorage.setItem(KEY_STORE, b64);
      else localStorage.removeItem(KEY_STORE);
    } catch (e) { /* storage disabled - unlock simply won't be remembered */ }
  });
}

function forgetKey() {
  try { sessionStorage.removeItem(KEY_STORE); localStorage.removeItem(KEY_STORE); } catch (e) {}
}

/* The user's own cost edits never leave their browser, and are stored
   encrypted so they are not readable from devtools' storage inspector. */
function loadLocalCosts() {
  var packed = null;
  try { packed = localStorage.getItem(COSTS_STORE); } catch (e) {}
  if (!packed || !cryptoKey) return Promise.resolve();
  return aesDecryptPacked(cryptoKey, packed).then(function (plain) {
    var d = JSON.parse(new TextDecoder().decode(plain));
    localCosts = { overrides: Object.create(null), added: Object.create(null) };
    var k;
    for (k in (d.overrides || {})) localCosts.overrides[k] = Number(d.overrides[k]);
    for (k in (d.added || {})) localCosts.added[k] = d.added[k];
  }).catch(function () {
    try { localStorage.removeItem(COSTS_STORE); } catch (e) {}
  });
}

function saveLocalCosts() {
  if (!cryptoKey) return Promise.resolve();
  var plain = new TextEncoder().encode(JSON.stringify({
    overrides: localCosts.overrides, added: localCosts.added
  }));
  return aesEncrypt(cryptoKey, plain).then(function (packed) {
    try { localStorage.setItem(COSTS_STORE, packed); } catch (e) {}
  });
}

function productCount() {
  var n = builtInOrder.length;
  for (var k in localCosts.added) if (!builtIn[k]) n++;
  return n;
}

function editedCount() {
  var n = 0, k;
  for (k in localCosts.overrides) n++;
  for (k in localCosts.added) if (!builtIn[k]) n++;
  return n;
}

/* The cost actually used for a product: the user's edit if present,
   otherwise the built-in figure, otherwise null (unknown product). */
function lookupCost(code) {
  var k = String(code || '').trim().toUpperCase();
  if (!k) return null;
  if (localCosts.overrides[k] !== undefined) {
    return { code: k, cost: localCosts.overrides[k], edited: true,
             name: (builtIn[k] || localCosts.added[k] || {}).name || '',
             cat: (builtIn[k] || localCosts.added[k] || {}).cat || '' };
  }
  if (builtIn[k]) return { code: k, cost: builtIn[k].cost, edited: false,
                           name: builtIn[k].name, cat: builtIn[k].cat };
  if (localCosts.added[k]) return { code: k, cost: Number(localCosts.added[k].cost) || 0,
                                    edited: true, name: localCosts.added[k].name || '',
                                    cat: localCosts.added[k].cat || '' };
  return null;
}

/* Every product row the settings panel shows. */
function allProducts() {
  var out = [], seen = Object.create(null), i, k;
  for (i = 0; i < builtInOrder.length; i++) {
    k = builtInOrder[i]; seen[k] = true;
    out.push({ key: k, code: builtIn[k].code, name: builtIn[k].name, cat: builtIn[k].cat,
               base: builtIn[k].cost,
               cost: localCosts.overrides[k] !== undefined ? localCosts.overrides[k] : builtIn[k].cost,
               edited: localCosts.overrides[k] !== undefined, added: false });
  }
  for (k in localCosts.added) {
    if (seen[k]) continue;
    var a = localCosts.added[k];
    out.push({ key: k, code: a.code || k, name: a.name || '', cat: a.cat || '',
               base: null,
               cost: localCosts.overrides[k] !== undefined ? localCosts.overrides[k] : Number(a.cost) || 0,
               edited: true, added: true });
  }
  return out;
}

var ARABIC_DIGITS = /[٠-٩۰-۹]/g;

function num(v) {
  if (v === null || v === undefined || v === '') return 0;
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  var s = String(v).trim();
  s = s.replace(ARABIC_DIGITS, function (d) {
    var c = d.charCodeAt(0);
    return String(c >= 0x06f0 ? c - 0x06f0 : c - 0x0660);
  });
  s = s.replace(/\u066b/g, '.').replace(/[\u066c\u060c,\s\u00a0'_]/g, '');
  var neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  if (/^[-−]/.test(s)) { neg = true; s = s.slice(1); }
  s = s.replace(/[^0-9.]/g, '');
  var n = parseFloat(s);
  if (!isFinite(n)) return 0;
  return neg ? -n : n;
}

/* Strips bidi control marks that Excel exports sprinkle into Arabic labels. */
function clean(v) {
  return String(v === null || v === undefined ? '' : v)
    .replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069\u200b]/g, '');
}

function fmtMoney(n) {
  if (n === null || n === undefined || !isFinite(n)) return '—';
  return Math.round(n).toLocaleString('en-GB');
}

/* Unit costs carry fractions (e.g. 3,915.05), so they always show 2 decimals.
   Full precision is kept in the arithmetic and in the Excel export. */
function fmtCost(n) {
  if (n === null || n === undefined || !isFinite(n)) return '—';
  return Number(n).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtQty(n) {
  if (n === null || n === undefined || !isFinite(n)) return '—';
  return (Math.round(n * 100) / 100).toLocaleString('en-GB');
}
function fmtPct(n) {
  if (n === null || n === undefined || !isFinite(n)) return '—';
  return (Math.round(n * 10) / 10).toFixed(1) + '%';
}
function signClass(n) { return n > 0 ? 'positive' : (n < 0 ? 'negative' : 'zero'); }
function margin(profit, sales) { return sales ? (profit / sales) * 100 : null; }

function norm(s) {
  return clean(s).toLowerCase()
    .replace(/[\u064b-\u0652\u0640]/g, '')            // harakat + tatweel
    .replace(/[\u0622\u0623\u0625\u0671]/g, '\u0627')  // alef variants
    .replace(/\u0629/g, '\u0647')                        // ta marbuta
    .replace(/[\u064a\u0649]/g, '\u064a')                // ya variants
    .replace(/[^a-z0-9\u0600-\u06ff]+/g, ' ')
    .trim();
}

function matchesAny(value, list) {
  var v = norm(value);
  if (!v) return false;
  for (var i = 0; i < list.length; i++) {
    if (v === list[i] || v.indexOf(list[i]) !== -1) return true;
  }
  return false;
}

/* =========================  file reading  ========================= */

function readWorkbook(file) {
  return new Promise(function (resolve, reject) {
    validateFile(file);
    var reader = new FileReader();
    reader.onerror = function () { reject(new Error('READ')); };
    reader.onload = function (e) {
      try {
        if (typeof XLSX === 'undefined' || !XLSX.read) { reject(new Error('LIB')); return; }
        var wb = XLSX.read(new Uint8Array(e.target.result), {
          type: 'array',
          cellDates: false,
          cellFormula: false,   // never keep formulas from an untrusted file
          cellHTML: false,      // never let the parser build HTML for us
          cellStyles: false,
          sheetStubs: false
        });
        assertCleanPrototype();
        resolve(wb);
      } catch (err) {
        reject(err && err.message === 'PROTO_POLLUTION' ? err : new Error('READ'));
      }
    };
    reader.readAsArrayBuffer(file);
  });
}

function sheetRows(ws) {
  var rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, blankrows: true });
  assertCleanPrototype();
  if (rows.length > MAX_ROWS) throw new Error('TOO_MANY_ROWS');
  return rows;
}

/* =========================  cost file parser  ========================= */

var COST_HEADERS = {
  name: ['name', 'product', 'product name', 'item', 'description', 'اسم', 'اسم المنتج', 'المنتج', 'الصنف', 'البيان', 'اسم الصنف'],
  ref:  ['internal reference', 'reference', 'internal ref', 'code', 'item code', 'product code', 'sku', 'default code',
         'المرجع الداخلي', 'المرجع', 'الرمز', 'رمز المنتج', 'الكود', 'كود', 'رمز الصنف', 'رقم الصنف'],
  cost: ['cost', 'unit cost', 'cost price', 'standard price', 'التكلفه', 'تكلفه', 'سعر التكلفه', 'الكلفه', 'كلفه', 'سعر الكلفه'],
  cat:  ['product category', 'category', 'categ', 'group', 'product group', 'فئه المنتج', 'الفئه', 'فئه', 'التصنيف', 'المجموعه', 'مجموعه المنتج']
};

function findCostColumns(rows) {
  var limit = Math.min(rows.length, 25);
  for (var r = 0; r < limit; r++) {
    var row = rows[r];
    if (!row) continue;
    var found = { name: -1, ref: -1, cost: -1, cat: -1 };
    for (var c = 0; c < row.length; c++) {
      var cell = row[c];
      if (cell === null || cell === undefined || typeof cell === 'number') continue;
      if (found.ref === -1 && matchesAny(cell, COST_HEADERS.ref)) { found.ref = c; continue; }
      if (found.cat === -1 && matchesAny(cell, COST_HEADERS.cat)) { found.cat = c; continue; }
      if (found.cost === -1 && matchesAny(cell, COST_HEADERS.cost)) { found.cost = c; continue; }
      if (found.name === -1 && matchesAny(cell, COST_HEADERS.name)) { found.name = c; continue; }
    }
    if (found.ref !== -1 && found.cost !== -1) {
      found.headerRow = r;
      return found;
    }
  }
  return null;
}

function parseCostWorkbook(wb) {
  var best = null;
  for (var i = 0; i < wb.SheetNames.length; i++) {
    var ws = wb.Sheets[wb.SheetNames[i]];
    if (!ws) continue;
    var rows = sheetRows(ws);
    var cols = findCostColumns(rows);
    if (cols) { best = { rows: rows, cols: cols, sheet: wb.SheetNames[i] }; break; }
  }
  if (!best) throw new Error('COST_COLS');

  var map = Object.create(null);       // null-prototype: no __proto__ surprises
  var dupes = Object.create(null);
  var count = 0;

  for (var r = best.cols.headerRow + 1; r < best.rows.length; r++) {
    var row = best.rows[r];
    if (!row) continue;
    var ref = clean(row[best.cols.ref]).trim();
    if (!ref) continue;
    var key = ref.toUpperCase();
    if (map[key]) dupes[key] = (dupes[key] || 1) + 1;
    map[key] = {
      code: ref,
      name: best.cols.name !== -1 ? clean(row[best.cols.name]).trim() : '',
      cost: num(row[best.cols.cost]),
      category: best.cols.cat !== -1 ? clean(row[best.cols.cat]).trim() : ''
    };
    count++;
  }

  if (!count) throw new Error('COST_COLS');

  var dupeList = Object.keys(dupes);
  return { map: map, count: count, unique: Object.keys(map).length, dupes: dupeList, sheet: best.sheet };
}

/* =========================  sales file parser  =========================
   The sales export is a tree flattened into one column, where depth is encoded
   as leading spaces:

       الإجمالي                       <- grand total
            ياسر علوان - جملة         <- salesperson
                 عصائر                <- category
                      [CODE] ...      <- product

   Levels are derived from the data itself rather than hard-coded, so an export
   without the grand-total row, or without the category level, still parses.
   ---------------------------------------------------------------------- */

var QTY_HEADERS = ['product quantity', 'quantity', 'qty', 'كميه المنتج', 'الكميه', 'كميه', 'عدد'];
var AMT_HEADERS = ['amount after discount', 'amount', 'total amount', 'net amount', 'sales', 'turnover',
                   'المبلغ بعد الخصم', 'المبلغ بعد الحسم', 'المبلغ', 'اجمالي المبلغ', 'المبيعات', 'صافي المبلغ'];
var TOTAL_WORDS = ['الاجمالي', 'الاجمالى', 'المجموع', 'اجمالي', 'total', 'grand total', 'sum'];
var CODE_RE = /^\[([^\]]{1,64})\]\s*([\s\S]*)$/;

function findSalesLayout(rows) {
  var limit = Math.min(rows.length, 25);
  var layout = { label: 0, qty: -1, amt: -1, headerRow: -1 };

  for (var r = 0; r < limit; r++) {
    var row = rows[r];
    if (!row) continue;
    var qty = -1, amt = -1;
    for (var c = 0; c < row.length; c++) {
      var cell = row[c];
      if (cell === null || cell === undefined || typeof cell === 'number') continue;
      if (qty === -1 && matchesAny(cell, QTY_HEADERS)) { qty = c; continue; }
      if (amt === -1 && matchesAny(cell, AMT_HEADERS)) { amt = c; continue; }
    }
    if (qty !== -1) {
      layout.qty = qty;
      layout.amt = amt !== -1 ? amt : (qty + 1);
      layout.headerRow = r;
      break;
    }
  }

  // Fall back to the conventional layout: label | quantity | amount.
  if (layout.qty === -1) { layout.qty = 1; layout.amt = 2; layout.headerRow = -1; }

  // The label column is the first column that actually carries the tree.
  var labelCol = -1;
  for (var rr = layout.headerRow + 1; rr < rows.length && labelCol === -1; rr++) {
    var rw = rows[rr];
    if (!rw) continue;
    for (var cc = 0; cc < rw.length; cc++) {
      if (cc === layout.qty || cc === layout.amt) continue;
      var v = rw[cc];
      if (typeof v === 'string' && clean(v).trim()) { labelCol = cc; break; }
    }
  }
  layout.label = labelCol === -1 ? 0 : labelCol;
  return layout;
}

function parseSalesWorkbook(wb) {
  var chosen = null;
  for (var i = 0; i < wb.SheetNames.length; i++) {
    var ws = wb.Sheets[wb.SheetNames[i]];
    if (!ws) continue;
    var rows = sheetRows(ws);
    var layout = findSalesLayout(rows);
    var entries = extractEntries(rows, layout);
    var productish = 0;
    for (var k = 0; k < entries.length; k++) if (CODE_RE.test(entries[k].label)) productish++;
    if (productish > 0) { chosen = { entries: entries, sheet: wb.SheetNames[i], layout: layout }; break; }
    if (!chosen && entries.length) chosen = { entries: entries, sheet: wb.SheetNames[i], layout: layout };
  }
  if (!chosen) throw new Error('SALES_ROWS');
  var records = buildRecords(chosen.entries);
  if (!records.length) throw new Error('SALES_ROWS');
  return { records: records, sheet: chosen.sheet };
}

function extractEntries(rows, layout) {
  var out = [];
  for (var r = layout.headerRow + 1; r < rows.length; r++) {
    var row = rows[r];
    if (!row) continue;
    var raw = row[layout.label];
    if (raw === null || raw === undefined) continue;
    var s = clean(raw);
    var label = s.replace(/^[\s\u00a0]+/, '').trim();
    if (!label) continue;
    out.push({
      indent: s.length - s.replace(/^[\s\u00a0]+/, '').length,
      label: label,
      qty: num(row[layout.qty]),
      amt: num(row[layout.amt])
    });
  }
  return out;
}

/* Turns the flat, indented entry list into product records carrying their
   salesperson and category. */
function buildRecords(entries) {
  var i, e;

  // 1. Products are the rows tagged with an internal code; if an export drops
  //    the brackets, fall back to the deepest indentation level.
  var coded = 0;
  for (i = 0; i < entries.length; i++) if (CODE_RE.test(entries[i].label)) coded++;

  var maxIndent = 0;
  for (i = 0; i < entries.length; i++) if (entries[i].indent > maxIndent) maxIndent = entries[i].indent;

  for (i = 0; i < entries.length; i++) {
    e = entries[i];
    e.isProduct = coded > 0 ? CODE_RE.test(e.label) : (e.indent === maxIndent && maxIndent > 0);
  }

  // 2. Drop the grand-total row(s) so they don't get mistaken for a salesperson.
  var groupIndents = [];
  var minGroupIndent = Infinity;
  for (i = 0; i < entries.length; i++) {
    if (!entries[i].isProduct && entries[i].indent < minGroupIndent) minGroupIndent = entries[i].indent;
  }
  for (i = 0; i < entries.length; i++) {
    e = entries[i];
    e.isTotal = !e.isProduct && e.indent === minGroupIndent && matchesAny(e.label, TOTAL_WORDS);
  }

  // 3. Rank the remaining group levels: deepest = category, next = salesperson.
  var seen = Object.create(null);
  for (i = 0; i < entries.length; i++) {
    e = entries[i];
    if (e.isProduct || e.isTotal) continue;
    if (!seen[e.indent]) { seen[e.indent] = true; groupIndents.push(e.indent); }
  }
  groupIndents.sort(function (a, b) { return a - b; });

  var catIndent = groupIndents.length ? groupIndents[groupIndents.length - 1] : null;
  var personIndent = groupIndents.length > 1 ? groupIndents[groupIndents.length - 2] : null;

  // 4. No indentation at all (some exporters strip it): infer from structure —
  //    a group row directly followed by a product is a category, otherwise it
  //    opens a salesperson.
  var noIndent = groupIndents.length === 1 && maxIndent === 0;
  if (noIndent) {
    for (i = 0; i < entries.length; i++) {
      e = entries[i];
      if (e.isProduct || e.isTotal) continue;
      var nextIsProduct = false;
      for (var j = i + 1; j < entries.length; j++) {
        if (entries[j].isTotal) continue;
        nextIsProduct = entries[j].isProduct;
        break;
      }
      e.level = nextIsProduct ? 'category' : 'person';
    }
  } else {
    for (i = 0; i < entries.length; i++) {
      e = entries[i];
      if (e.isProduct || e.isTotal) continue;
      if (personIndent !== null && e.indent === catIndent) e.level = 'category';
      else if (personIndent !== null && e.indent === personIndent) e.level = 'person';
      else if (personIndent === null && e.indent === catIndent) e.level = 'person';
      else e.level = 'ignore';
    }
  }

  // 5. Walk the list keeping the current salesperson / category in scope.
  var records = [];
  var person = '', category = '';
  var unnamed = isAr() ? 'غير محدد' : 'Unspecified';

  for (i = 0; i < entries.length; i++) {
    e = entries[i];
    if (e.isTotal) continue;
    if (!e.isProduct) {
      if (e.level === 'person') { person = e.label; category = ''; }
      else if (e.level === 'category') { category = e.label; }
      continue;
    }
    var m = CODE_RE.exec(e.label);
    records.push({
      code: m ? m[1].trim() : '',
      name: m ? (m[2] || '').trim() : e.label,
      person: person || unnamed,
      category: category || unnamed,
      qty: e.qty,
      sales: e.amt
    });
  }
  return records;
}

/* =========================  state  ========================= */

var state = {
  salesFile: null,
  sales: null,
  records: [],            // one row per sold product, costed
  persons: [],            // [{name, selected}]
  unmatched: [],          // codes sold but absent from the cost table
  view: 'product',
  search: '',
  filters: Object.create(null),
  sort: { product: { f: 'profit', d: -1 }, category: { f: 'profit', d: -1 }, person: { f: 'profit', d: -1 } }
};

function costRecords() {
  var unmatched = [];
  var seenUnmatched = Object.create(null);

  var out = state.sales.records.map(function (r) {
    var c = lookupCost(r.code);
    var unitCost = c ? c.cost : 0;
    var totalCost = unitCost * r.qty;
    if (!c && (r.qty !== 0 || r.sales !== 0)) {
      var k = r.code || r.name;
      if (!seenUnmatched[k]) { seenUnmatched[k] = true; unmatched.push(r.code || r.name); }
    }
    return {
      code: r.code, name: r.name || (c ? c.name : ''),
      person: r.person, category: r.category,
      costCategory: c ? c.cat : '',
      qty: r.qty, sales: r.sales,
      unitCost: unitCost, totalCost: totalCost,
      profit: r.sales - totalCost,
      matched: !!c, costEdited: !!(c && c.edited)
    };
  });

  state.unmatched = unmatched;
  return out;
}

function selectedPersons() {
  return state.persons.filter(function (p) { return p.selected; }).map(function (p) { return p.name; });
}

function activeRecords() {
  var picked = Object.create(null);
  selectedPersons().forEach(function (n) { picked[n] = true; });
  var q = norm(state.search);
  var f = state.filters;

  return state.records.filter(function (r) {
    if (!picked[r.person]) return false;
    if (q) {
      var hay = norm(r.name + ' ' + r.code + ' ' + r.category + ' ' + r.person);
      if (hay.indexOf(q) === -1) return false;
    }
    if (state.view === 'product') {
      if (f.profit && !(r.profit > 0)) return false;
      if (f.loss && !(r.profit < 0)) return false;
      if (f.nocost && r.matched) return false;
      if (f.active && r.qty === 0 && r.sales === 0) return false;
    }
    return true;
  });
}

function emptyAgg(extra) {
  var o = { qty: 0, sales: 0, totalCost: 0, profit: 0, items: 0 };
  if (extra) for (var k in extra) o[k] = extra[k];
  return o;
}

function addTo(agg, r) {
  agg.qty += r.qty; agg.sales += r.sales;
  agg.totalCost += r.totalCost; agg.profit += r.profit;
  agg.items++;
}

function groupBy(records, keyFn, seed) {
  var map = Object.create(null);
  var order = [];
  records.forEach(function (r) {
    var k = keyFn(r);
    if (!map[k]) { map[k] = seed(r, k); order.push(k); }
    addTo(map[k], r);
    if (map[k].extend) map[k].extend(r);
  });
  return order.map(function (k) { return map[k]; });
}

function productRows(records) {
  return groupBy(records, function (r) { return (r.code || r.name) + '|' + r.category; }, function (r, k) {
    var g = emptyAgg({
      key: k, code: r.code, name: r.name, category: r.category,
      unitCost: r.unitCost, matched: r.matched,
      persons: Object.create(null), personCount: 0, firstPerson: r.person
    });
    g.extend = function (rec) {
      if (!g.persons[rec.person]) { g.persons[rec.person] = true; g.personCount++; }
      if (!g.matched) g.matched = rec.matched;
      if (!g.unitCost && rec.unitCost) g.unitCost = rec.unitCost;
    };
    return g;
  });
}

function categoryRows(records) {
  return groupBy(records, function (r) { return r.category; }, function (r, k) {
    var g = emptyAgg({ key: k, name: k, products: Object.create(null), productCount: 0 });
    g.extend = function (rec) {
      var pk = rec.code || rec.name;
      if (!g.products[pk]) { g.products[pk] = true; g.productCount++; }
    };
    return g;
  });
}

function personRows(records) {
  return groupBy(records, function (r) { return r.person; }, function (r, k) {
    var g = emptyAgg({ key: k, name: k, cats: Object.create(null), catCount: 0, products: Object.create(null), productCount: 0 });
    g.extend = function (rec) {
      if (!g.cats[rec.category]) { g.cats[rec.category] = true; g.catCount++; }
      var pk = rec.code || rec.name;
      if (!g.products[pk]) { g.products[pk] = true; g.productCount++; }
    };
    return g;
  });
}

function totals(rows) {
  var tt = emptyAgg();
  rows.forEach(function (r) {
    tt.qty += r.qty; tt.sales += r.sales; tt.totalCost += r.totalCost;
    tt.profit += r.profit; tt.items += (r.items || 0);
  });
  return tt;
}

function sortRows(rows, view) {
  var s = state.sort[view];
  if (!s) return rows;
  var f = s.f, d = s.d;
  return rows.slice().sort(function (a, b) {
    var av, bv;
    if (f === 'name') { av = norm(a.name); bv = norm(b.name); }
    else if (f === 'margin') { av = margin(a.profit, a.sales); bv = margin(b.profit, b.sales); av = (av === null ? -Infinity : av); bv = (bv === null ? -Infinity : bv); }
    else { av = a[f] || 0; bv = b[f] || 0; }
    if (av < bv) return -1 * d;
    if (av > bv) return 1 * d;
    return 0;
  });
}

/* =========================  rendering  ========================= */

function renderAlerts(container, items) {
  var el = $(container);
  el.innerHTML = items.map(function (a) {
    return '<div class="alert alert-' + esc(a.type) + '">' + a.html + '</div>';
  }).join('');
}

function renderDataAlerts() {
  var items = [];
  if (state.unmatched.length) {
    var list = state.unmatched.slice(0, 25).map(function (c) { return '<code>' + esc(c) + '</code>'; }).join(' ');
    if (state.unmatched.length > 25) list += ' …';
    items.push({ type: 'warn', html: '⚠️ <b>' + state.unmatched.length + '</b> ' + esc(t('warnNoCost')) +
      ' ' + list + '<br/>' + esc(t('unknownNote')) });
  }
  renderAlerts('data-alerts', items);
}

function renderPersons() {
  var counts = Object.create(null);
  state.records.forEach(function (r) {
    if (!counts[r.person]) counts[r.person] = { sales: 0, profit: 0 };
    counts[r.person].sales += r.sales;
    counts[r.person].profit += r.profit;
  });
  $('sp-list').innerHTML = state.persons.map(function (p, i) {
    var c = counts[p.name] || { profit: 0 };
    return '<button type="button" class="sp-chip' + (p.selected ? ' on' : '') + '" data-idx="' + i + '">' +
      '<span class="sp-box">' + (p.selected ? '✓' : '') + '</span>' +
      '<span class="sp-name">' + esc(p.name) + '</span>' +
      '<span class="sp-amt">' + esc(fmtMoney(c.profit)) + '</span>' +
    '</button>';
  }).join('');
}

function statCard(label, value, cls, sub) {
  return '<div class="stat-card">' +
    '<div class="stat-label">' + esc(label) + '</div>' +
    '<div class="stat-value ' + (cls || '') + '">' + esc(value) + '</div>' +
    (sub ? '<div class="stat-sub">' + esc(sub) + '</div>' : '') +
  '</div>';
}

function renderStats(records) {
  var tt = emptyAgg();
  var noCost = 0;
  var prodKeys = Object.create(null), prodCount = 0;
  records.forEach(function (r) {
    tt.qty += r.qty; tt.sales += r.sales; tt.totalCost += r.totalCost; tt.profit += r.profit;
    if (!r.matched) noCost++;
    var k = r.code || r.name;
    if (!prodKeys[k]) { prodKeys[k] = true; prodCount++; }
  });
  var m = margin(tt.profit, tt.sales);
  $('stats-row').innerHTML =
    statCard(t('stSales'), fmtMoney(tt.sales), 'accent') +
    statCard(t('stCost'), fmtMoney(tt.totalCost), 'amber') +
    statCard(t('stProfit'), fmtMoney(tt.profit), tt.profit >= 0 ? 'green' : 'red') +
    statCard(t('stMargin'), fmtPct(m), tt.profit >= 0 ? 'green' : 'red') +
    statCard(t('stQty'), fmtQty(tt.qty), 'teal') +
    statCard(t('stItems'), String(prodCount), '', noCost ? noCost + ' ' + t('stNoCost') : '');
}

function barPanel(title, rows, limit) {
  var top = rows.slice().sort(function (a, b) { return Math.abs(b.profit) - Math.abs(a.profit); }).slice(0, limit);
  var max = 0;
  top.forEach(function (r) { if (Math.abs(r.profit) > max) max = Math.abs(r.profit); });
  var body = top.length ? top.map(function (r) {
    var w = max ? (Math.abs(r.profit) / max) * 100 : 0;
    return '<div class="bar-row">' +
      '<div class="bar-head">' +
        '<span class="bar-label" title="' + esc(r.name) + '">' + esc(r.name) + '</span>' +
        '<span class="bar-val ' + (r.profit >= 0 ? 'amount positive' : 'amount negative') + '">' + esc(fmtMoney(r.profit)) + '</span>' +
      '</div>' +
      '<div class="bar-track"><div class="bar-fill ' + (r.profit >= 0 ? 'pos' : 'neg') + '" style="width:' + w.toFixed(2) + '%"></div></div>' +
    '</div>';
  }).join('') : '<div class="empty">' + esc(t('noResults')) + '</div>';
  return '<div class="panel"><div class="panel-title">' + esc(title) + '</div>' + body + '</div>';
}

function moverPanel(title, rows, limit, worst) {
  var sorted = rows.slice().sort(function (a, b) { return worst ? a.profit - b.profit : b.profit - a.profit; }).slice(0, limit);
  var body = sorted.length ? sorted.map(function (r) {
    var m = margin(r.profit, r.sales);
    return '<div class="mover">' +
      '<div style="min-width:0">' +
        '<div class="mover-name" title="' + esc(r.name) + '">' + esc(r.name) + '</div>' +
        '<div class="mover-meta">' + esc(r.code || r.category) + ' · ' + esc(fmtPct(m)) + '</div>' +
      '</div>' +
      '<div class="mover-val ' + (r.profit >= 0 ? 'amount positive' : 'amount negative') + '">' + esc(fmtMoney(r.profit)) + '</div>' +
    '</div>';
  }).join('') : '<div class="empty">' + esc(t('noResults')) + '</div>';
  return '<div class="panel"><div class="panel-title">' + esc(title) + '</div>' + body + '</div>';
}

function renderPanels(records) {
  var cats = categoryRows(records);
  var people = personRows(records);
  var prods = productRows(records);
  $('panel-grid').innerHTML =
    barPanel(t('chartCat'), cats, 10) +
    barPanel(t('chartPerson'), people, 10) +
    moverPanel(t('topItems'), prods, 6, false) +
    moverPanel(t('bottomItems'), prods, 6, true);
}

function sortArrow(view, field) {
  var s = state.sort[view];
  var active = s && s.f === field;
  return '<span class="sort-arrow' + (active ? ' active' : '') + '">' + (active ? (s.d === 1 ? '▲' : '▼') : '▲') + '</span>';
}

function th(view, field, label, isNum) {
  return '<th class="sortable' + (isNum ? ' num' : '') +
    (state.sort[view] && state.sort[view].f === field ? ' sort-active' : '') +
    '" data-sort="' + esc(field) + '">' + esc(label) + sortArrow(view, field) + '</th>';
}

function moneyTd(n) {
  return '<td class="num"><span class="amount ' + signClass(n) + '">' + esc(fmtMoney(n)) + '</span></td>';
}

function marginTd(profit, sales) {
  var m = margin(profit, sales);
  var cls = m === null ? 'badge-gray' : (m > 0 ? 'badge-green' : (m < 0 ? 'badge-red' : 'badge-gray'));
  return '<td class="num"><span class="badge ' + cls + '">' + esc(fmtPct(m)) + '</span></td>';
}

function tableShell(head, body, foot) {
  return '<div class="table-wrap"><table><thead><tr>' + head + '</tr></thead>' +
    '<tbody>' + body + '</tbody>' + (foot ? '<tfoot><tr>' + foot + '</tr></tfoot>' : '') +
    '</table></div>';
}

function renderProductTable(records) {
  var rows = sortRows(productRows(records), 'product');
  var head =
    th('product', 'name', t('colProduct')) +
    th('product', 'category', t('colCategory')) +
    '<th>' + esc(t('colPerson')) + '</th>' +
    th('product', 'qty', t('colQty'), true) +
    th('product', 'unitCost', t('colUnitCost'), true) +
    th('product', 'totalCost', t('colTotalCost'), true) +
    th('product', 'sales', t('colSales'), true) +
    th('product', 'profit', t('colProfit'), true) +
    th('product', 'margin', t('colMargin'), true);

  if (!rows.length) return tableShell(head, '<tr><td colspan="9"><div class="empty">' + esc(t('noResults')) + '</div></td></tr>', '');

  var body = rows.map(function (r) {
    var who = r.personCount > 1 ? (r.personCount + ' ' + t('multiPersons')) : r.firstPerson;
    return '<tr' + (r.matched ? '' : ' class="row-warn"') + '>' +
      '<td><div class="p-name">' + esc(r.name) +
        (r.matched ? '' : ' <span class="badge badge-amber">⚠ ' + esc(t('noCostBadge')) + '</span>') +
      '</div>' + (r.code ? '<div class="p-code">' + esc(r.code) + '</div>' : '') + '</td>' +
      '<td class="bidi">' + esc(r.category) + '</td>' +
      '<td class="bidi">' + esc(who) + '</td>' +
      '<td class="num">' + esc(fmtQty(r.qty)) + '</td>' +
      '<td class="num">' + (r.matched
          ? esc(fmtCost(r.unitCost)) + (r.costEdited ? ' <span class="badge badge-teal">✎</span>' : '')
          : '—') + '</td>' +
      moneyTd(r.totalCost) +
      moneyTd(r.sales) +
      moneyTd(r.profit) +
      marginTd(r.profit, r.sales) +
    '</tr>';
  }).join('');

  var tt = totals(rows);
  var foot = '<td>' + esc(t('total')) + '</td><td></td><td></td>' +
    '<td class="num">' + esc(fmtQty(tt.qty)) + '</td><td></td>' +
    '<td class="num">' + esc(fmtMoney(tt.totalCost)) + '</td>' +
    '<td class="num">' + esc(fmtMoney(tt.sales)) + '</td>' +
    '<td class="num"><span class="amount ' + signClass(tt.profit) + '">' + esc(fmtMoney(tt.profit)) + '</span></td>' +
    '<td class="num">' + esc(fmtPct(margin(tt.profit, tt.sales))) + '</td>';

  return tableShell(head, body, foot);
}

function renderGroupTable(records, view) {
  var rows = sortRows(view === 'category' ? categoryRows(records) : personRows(records), view);
  var isCat = view === 'category';
  var head =
    th(view, 'name', isCat ? t('colCategory') : t('colPerson')) +
    (isCat ? '' : th(view, 'catCount', t('colCats'), true)) +
    th(view, 'productCount', t('colItems'), true) +
    th(view, 'qty', t('colQty'), true) +
    th(view, 'totalCost', t('colTotalCost'), true) +
    th(view, 'sales', t('colSales'), true) +
    th(view, 'profit', t('colProfit'), true) +
    th(view, 'margin', t('colMargin'), true);

  var span = isCat ? 7 : 8;
  if (!rows.length) return tableShell(head, '<tr><td colspan="' + span + '"><div class="empty">' + esc(t('noResults')) + '</div></td></tr>', '');

  var body = rows.map(function (r) {
    return '<tr>' +
      '<td><div class="p-name">' + esc(r.name) + '</div></td>' +
      (isCat ? '' : '<td class="num">' + esc(String(r.catCount)) + '</td>') +
      '<td class="num">' + esc(String(r.productCount)) + '</td>' +
      '<td class="num">' + esc(fmtQty(r.qty)) + '</td>' +
      moneyTd(r.totalCost) + moneyTd(r.sales) + moneyTd(r.profit) +
      marginTd(r.profit, r.sales) +
    '</tr>';
  }).join('');

  var tt = totals(rows);
  var foot = '<td>' + esc(t('total')) + '</td>' + (isCat ? '' : '<td></td>') + '<td></td>' +
    '<td class="num">' + esc(fmtQty(tt.qty)) + '</td>' +

    '<td class="num">' + esc(fmtMoney(tt.sales)) + '</td>' +
    '<td class="num"><span class="amount ' + signClass(tt.profit) + '">' + esc(fmtMoney(tt.profit)) + '</span></td>' +
    '<td class="num">' + esc(fmtPct(margin(tt.profit, tt.sales))) + '</td>';

  return tableShell(head, body, foot);
}

function renderCompare(records) {
  var people = personRows(records).sort(function (a, b) { return b.profit - a.profit; });
  if (!people.length) return '<div class="table-wrap"><div class="empty">' + esc(t('noResults')) + '</div></div>';
  var tt = totals(people);

  var metrics = [
    { label: t('colSales'), get: function (p) { return fmtMoney(p.sales); }, tot: fmtMoney(tt.sales) },
    { label: t('colTotalCost'), get: function (p) { return fmtMoney(p.totalCost); }, tot: fmtMoney(tt.totalCost) },
    { label: t('colProfit'), get: function (p) { return fmtMoney(p.profit); }, tot: fmtMoney(tt.profit), sign: true },
    { label: t('colMargin'), get: function (p) { return fmtPct(margin(p.profit, p.sales)); }, tot: fmtPct(margin(tt.profit, tt.sales)) },
    { label: t('colShare'), get: function (p) { return tt.profit ? fmtPct((p.profit / tt.profit) * 100) : '—'; }, tot: '100.0%' },
    { label: t('colQty'), get: function (p) { return fmtQty(p.qty); }, tot: fmtQty(tt.qty) },
    { label: t('colItems'), get: function (p) { return String(p.productCount); }, tot: '' },
    { label: t('colCats'), get: function (p) { return String(p.catCount); }, tot: '' }
  ];

  var head = '<th class="metric">' + esc(t('colPerson')) + '</th>' +
    people.map(function (p) { return '<th class="num">' + esc(p.name) + '</th>'; }).join('') +
    '<th class="num">' + esc(t('total')) + '</th>';

  var body = metrics.map(function (m) {
    return '<tr><td class="metric">' + esc(m.label) + '</td>' +
      people.map(function (p) {
        var v = m.get(p);
        var cls = m.sign ? ' class="amount ' + signClass(p.profit) + '"' : '';
        return '<td class="num"><span' + cls + '>' + esc(v) + '</span></td>';
      }).join('') +
      '<td class="num"><b>' + esc(m.tot) + '</b></td>' +
    '</tr>';
  }).join('');

  return '<div class="table-wrap cmp-wrap"><table class="cmp-table"><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div>';
}

function renderView() {

function setCost(key, raw) {
  var v = num(raw);
  if (!isFinite(v) || v < 0 || String(raw).trim() === '') return false;
  if (builtIn[key] && Math.abs(builtIn[key].cost - v) < 1e-9) delete localCosts.overrides[key];
  else localCosts.overrides[key] = v;
  saveLocalCosts();
  return true;
}

function undoCost(key) {
  delete localCosts.overrides[key];
  if (localCosts.added[key] && !builtIn[key]) delete localCosts.added[key];
  saveLocalCosts();
  renderCostList();
}

function resetAllCosts() {
  if (!window.confirm(t('cmResetConfirm'))) return;
  localCosts = { overrides: Object.create(null), added: Object.create(null) };
  saveLocalCosts();
  renderCostList();
}

/* Importing a cost sheet only writes into this browser's own storage. */
function importCostFile(file) {
  renderAlerts('cm-alerts', []);
  readWorkbook(file).then(function (wb) {
    var parsed = parseCostWorkbook(wb);
    var changed = 0, added = 0;
    for (var key in parsed.map) {
      var item = parsed.map[key];
      var cost = Number(item.cost) || 0;
      if (builtIn[key]) {
        if (Math.abs(builtIn[key].cost - cost) > 1e-9) { localCosts.overrides[key] = cost; changed++; }
        else delete localCosts.overrides[key];
      } else {
        localCosts.added[key] = { code: item.code, name: item.name, cost: cost, cat: item.category };
        delete localCosts.overrides[key];
        added++;
      }
    }
    saveLocalCosts();
    renderCostList();
    renderAlerts('cm-alerts', [{
      type: (changed || added) ? 'info' : 'warn',
      html: esc((changed || added)
        ? t('cmImported').replace('{a}', changed).replace('{b}', added)
        : t('cmImportNone'))
    }]);
  }).catch(function (err) {
    renderAlerts('cm-alerts', [{ type: 'err', html: '⛔ ' + esc(errorText(err)) }]);
  });
}

function handleSales(file) {
  renderAlerts('upload-alerts', []);
  readWorkbook(file).then(function (wb) {
    var parsed = parseSalesWorkbook(wb);
    state.salesFile = file;
    state.sales = parsed;
    $('zone-sales').classList.add('loaded');
    $('uz-sales-file').textContent = file.name + ' · ' + parsed.records.length + ' ' + t('rows');
    refreshAnalyzeButton();
  }).catch(function (err) {
    state.salesFile = null; state.sales = null;

    $('uz-sales-file').textContent = '';
    refreshAnalyzeButton();
    showUploadError(err);
  });
}

function refreshAnalyzeButton() {
  $('btn-analyze').disabled = !(state.sales && builtInOrder.length);
}

function analyze() {
  try {
    state.records = costRecords();
    var matched = 0;
    state.records.forEach(function (r) { if (r.matched) matched++; });
    if (!matched) throw new Error('NO_OVERLAP');

    var seen = Object.create(null);
    state.persons = [];
    state.records.forEach(function (r) {
      if (!seen[r.person]) { seen[r.person] = true; state.persons.push({ name: r.person, selected: true }); }
    });
    state.persons.sort(function (a, b) { return norm(a.name) < norm(b.name) ? -1 : 1; });

    showScreen('data');
    renderAll();
    window.scrollTo(0, 0);
  } catch (err) {
    showUploadError(err);
  }
}

function resetUpload() {
  state.salesFile = null; state.sales = null;
  state.records = []; state.persons = []; state.unmatched = [];
  state.search = ''; state.filters = Object.create(null); state.view = 'product';
  $('search').value = '';
  $('file-sales').value = '';
  $('uz-sales-file').textContent = '';
  $('zone-sales').classList.remove('loaded');
  renderAlerts('upload-alerts', []);
  renderAlerts('data-alerts', []);
  ['f-profit', 'f-loss', 'f-nocost', 'f-active'].forEach(function (id) { $(id).classList.remove('active'); });
  var tabs = document.querySelectorAll('#tabs .tab');
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.toggle('active', tabs[i].getAttribute('data-view') === 'product');
  showUpload();
  refreshAnalyzeButton();
}

function afterUnlock() {
  return loadLocalCosts().then(function () {
    showUpload();

function submitPassphrase(e) {
  if (e) e.preventDefault();
  var input = $('lock-input');
  var pass = input.value;
  if (!pass) return;
  var btn = $('lock-btn');
  btn.disabled = true; btn.textContent = t('lockWorking');
  $('lock-error').textContent = '';

  unlockWithPassphrase(pass).then(function (key) {
    input.value = '';
    return rememberKey(key, $('lock-remember').checked);
  }).then(afterUnlock).catch(function (err) {
    var m = err && err.message;
    $('lock-error').textContent =
      m === 'NO_CRYPTO' ? t('lockNoCrypto') : (m === 'NO_BLOB' ? t('lockNoBlob') : t('lockWrong'));
    input.select();
  }).then(function () {
    btn.disabled = false; btn.textContent = t('lockBtn');
  });
}

function lockAgain() {
  forgetKey();
  cryptoKey = null;
  builtIn = Object.create(null); builtInOrder = [];
  localCosts = { overrides: Object.create(null), added: Object.create(null) };
  state.records = []; state.sales = null; state.salesFile = null; state.persons = [];
  $('cost-overlay').classList.remove('show');
  showScreen('lock');
  $('lock-input').focus();
}

/* =========================  wiring  ========================= */

function wireZone(zoneId, inputId, handler) {
  var zone = $(zoneId), input = $(inputId);
  zone.addEventListener('click', function () { input.click(); });
  zone.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); }
  });
  zone.addEventListener('dragover', function (e) { e.preventDefault(); zone.classList.add('drag'); });
  zone.addEventListener('dragleave', function () { zone.classList.remove('drag'); });
  zone.addEventListener('drop', function (e) {
    e.preventDefault();
    zone.classList.remove('drag');
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) handler(e.dataTransfer.files[0]);
  });
  input.addEventListener('change', function (e) {
    if (e.target.files && e.target.files[0]) handler(e.target.files[0]);
  });
}

function toggleFilter(id, key) {
  $(id).addEventListener('click', function () {
    state.filters[key] = !state.filters[key];
    if (key === 'profit' && state.filters.profit) { state.filters.loss = false; $('f-loss').classList.remove('active'); }
    if (key === 'loss' && state.filters.loss) { state.filters.profit = false; $('f-profit').classList.remove('active'); }
    $(id).classList.toggle('active', !!state.filters[key]);
    renderView();
  });
}

var searchTimer = null, cmSearchTimer = null;

function init() {
  if (typeof XLSX === 'undefined' || !XLSX.read) {
    renderAlerts('upload-alerts', [{ type: 'err', html: '⛔ ' + esc(t('errRead')) }]);
  }

  wireZone('zone-sales', 'file-sales', handleSales);

  $('btn-analyze').addEventListener('click', analyze);
  $('btn-new').addEventListener('click', resetUpload);
  $('btn-back').addEventListener('click', showUpload);
  $('btn-export').addEventListener('click', exportExcel);
  $('btn-print').addEventListener('click', buildPrint);
  $('pf-print').addEventListener('click', function () { window.print(); });
  $('pf-close').addEventListener('click', function () { $('print-overlay').classList.remove('show'); });
  $('print-overlay').addEventListener('click', function (e) {
    if (e.target === $('print-overlay')) $('print-overlay').classList.remove('show');
  });

  $('lock-form').addEventListener('submit', submitPassphrase);

  $('btn-settings').addEventListener('click', openCostSettings);
  $('cm-close').addEventListener('click', closeCostSettings);
  $('cost-overlay').addEventListener('click', function (e) {
    if (e.target === $('cost-overlay')) closeCostSettings();
  });
  $('cm-changed').addEventListener('click', function () {
    cmFilter.changedOnly = !cmFilter.changedOnly;
    $('cm-changed').classList.toggle('active', cmFilter.changedOnly);
    renderCostList();
  });
  $('cm-search').addEventListener('input', function (e) {
    var v = e.target.value;
    clearTimeout(cmSearchTimer);
    cmSearchTimer = setTimeout(function () { cmFilter.q = v; renderCostList(); }, 160);
  });
  $('cm-reset').addEventListener('click', resetAllCosts);
  $('cm-lock').addEventListener('click', lockAgain);
  $('cm-import').addEventListener('click', function () { $('cm-file').click(); });
  $('cm-file').addEventListener('change', function (e) {
    if (e.target.files && e.target.files[0]) importCostFile(e.target.files[0]);
    e.target.value = '';
  });
  $('cm-list').addEventListener('change', function (e) {
    var input = e.target.closest ? e.target.closest('.cm-input') : null;
    if (!input) return;
    var key = input.getAttribute('data-key');
    if (setCost(key, input.value)) renderCostList();
    else {
      input.classList.add('edited');
      renderAlerts('cm-alerts', [{ type: 'err', html: '⛔ ' + esc(t('cmInvalid')) }]);
    }
  });
  $('cm-list').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.classList.contains('cm-input')) { e.preventDefault(); e.target.blur(); }
  });
  $('cm-list').addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.cm-undo') : null;
    if (btn && !btn.disabled) undoCost(btn.getAttribute('data-undo'));
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if ($('print-overlay').classList.contains('show')) $('print-overlay').classList.remove('show');
    else if ($('cost-overlay').classList.contains('show')) closeCostSettings();
  });

  $('lang-btn').addEventListener('click', function () { lang = isAr() ? 'en' : 'ar'; applyLang(); });
  $('theme-btn').addEventListener('click', function () { isDark = !isDark; applyTheme(); });

  $('sp-all').addEventListener('click', function () {
    state.persons.forEach(function (p) { p.selected = true; });
    renderPersons(); renderView();
  });
  $('sp-none').addEventListener('click', function () {
    state.persons.forEach(function (p) { p.selected = false; });
    renderPersons(); renderView();
  });
  $('sp-list').addEventListener('click', function (e) {
    var chip = e.target.closest ? e.target.closest('.sp-chip') : null;
    if (!chip) return;
    var idx = parseInt(chip.getAttribute('data-idx'), 10);
    if (isNaN(idx) || !state.persons[idx]) return;
    state.persons[idx].selected = !state.persons[idx].selected;
    renderPersons(); renderView();
  });

  $('search').addEventListener('input', function (e) {
    var v = e.target.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () { state.search = v; renderView(); }, 180);
  });

  toggleFilter('f-profit', 'profit');
  toggleFilter('f-loss', 'loss');
  toggleFilter('f-nocost', 'nocost');
  toggleFilter('f-active', 'active');

  $('tabs').addEventListener('click', function (e) {
    var tab = e.target.closest ? e.target.closest('.tab') : null;
    if (!tab) return;
    var tabs = document.querySelectorAll('#tabs .tab');
    for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
    tab.classList.add('active');
    state.view = tab.getAttribute('data-view');
    renderView();
  });

  $('view-body').addEventListener('click', function (e) {
    var header = e.target.closest ? e.target.closest('th[data-sort]') : null;
    if (!header) return;
    var view = state.view;
    if (!state.sort[view]) return;
    var f = header.getAttribute('data-sort');
    if (state.sort[view].f === f) state.sort[view].d *= -1;
    else state.sort[view] = { f: f, d: f === 'name' ? 1 : -1 };
    renderView();
  });

  applyTheme();
  applyLang();
  showScreen('lock');

  // A key remembered for this session or device skips the passphrase prompt.
  unlockWithStoredKey().then(afterUnlock).catch(function () {
    forgetKey();
    showScreen('lock');
    $('lock-input').focus();
  });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();
</script>
</body>
</html>
